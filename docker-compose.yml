services:
  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_USER: 'admin'
      MYSQL_PASSWORD: 'admin123'
      MYSQL_DATABASE: 'daily_diet_db'
      MYSQL_ROOT_PASSWORD: 'admin123'
    ports:
      - "3306:3306"
    expose:
      - "3306"
    volumes:
      - C:\Users\Usuário\Documents\mysql-data-5.7:/var/lib/mysql